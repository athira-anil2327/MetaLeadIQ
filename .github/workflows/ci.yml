name: MetaLeadIQ CI Pipeline

# 1. THE TRIGGER: When should this robot wake up?
on:
  push:
    branches: [ "main", "future-scope" ]
  pull_request:
    branches: [ "main" ]

# 2. THE JOBS: What should the robot do?
jobs:
  # Job A: Check the React Frontend
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest # The type of cloud server the robot uses

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Downloads your code onto the cloud server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Installs Node.js

      - name: Install Dependencies
        run: npm ci # A strict version of 'npm install' for pipelines

      - name: Build React App
        run: npm run build # Verifies that the TypeScript compiles cleanly

  # Job B: Check the FastAPI Backend
  backend-test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest # Installing pytest explicitly for the pipeline

      - name: Check Python Syntax
        # This acts as a basic check before we write actual unit tests
        run: python -m py_compile backend/app.py backend/score_leads.py
